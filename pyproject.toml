[build-system]
requires = ["setuptools>=77"]  # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "macecho"
version = "0.2.0"
description = "Ears and a voice for AI agents, running entirely on your Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"  # onnxruntime (Silero VAD) has no wheels for newer Pythons yet
dependencies = [
    # ZONOS3-Mini, the voice: its support is on mlx-audio's main branch, not yet in a PyPI release.
    "mlx-audio @ git+https://github.com/Neywa-Labs/mlx-audio@b5fcbe964b9e4cad4b06782f97d3e51fe74a8702",
    "parakeet-mlx==0.7.0",  # Fluid Speech Pro, the ears (via macecho/fluid_speech_mlx.py)
    "numpy",
    "onnxruntime>=1.17",
    "pydantic>=2",
    "sounddevice>=0.4.6",
    "soxr",  # the voice's 44.1 kHz to the players' 24 kHz
]

[project.optional-dependencies]
# The menu bar and Dock app (macecho.menubar); the legacy ASR/LLM/TTS stack stays in requirements.txt.
# AVFoundation: echo cancellation (macecho.device.voice_io); without it the app runs without.
# anthropic: Claude Haiku is the app's brain (macecho.brain); it needs ANTHROPIC_API_KEY.
app = ["rumps", "pyobjc-framework-WebKit", "pyobjc-framework-AVFoundation", "pydantic-settings>=2",
       "anthropic>=2.8"]

[project.scripts]
macecho = "macecho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macecho = ["agent_guide.md", "vad/*.onnx", "ui/index.html"]
